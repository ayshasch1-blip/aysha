<body>
<header><div class="tag">🎓 طالبات التكنولوجيا | اختبار البرمجيات</div><h1>🕵🏻‍♀️ محققات الأخطاء البرمجية</h1><p>مغامرة تفاعلية لاكتشاف الأخطاء اللغوية والمنطقية وأخطاء وقت التشغيل</p></header>
<main><div class="panel" style="margin-bottom:16px;background:#29254e"><label for="topStudent" style="margin-top:0">👩🏻‍🎓 اسم الطالبة المحققة</label><input id="topStudent" placeholder="اكتبي اسم الطالبة هنا قبل بدء التحقيق" oninput="name=this.value" autocomplete="off"><p class="small">سيظهر هذا الاسم في تقرير الأدلة والشهادة النهائية.</p></div><div class="steps" id="progress"></div><section class="panel" id="app"></section><div class="footer">مختبر الأدلة الرقمية • تعلّمي، حلّلي، صحّحي، ووثّقي اكتشافكِ ✨</div></main>
<script>
const cases=[
{title:"البرنامج الذي رفض البدء",incident:"أبلغت طالبة أن البرنامج لا يبدأ التنفيذ. افحصي الشيفرة واكتشفي السبب.",code:'student_name = "Sara"\nprint("Welcome", student_name',type:0,explanation:"يوجد قوس إغلاق مفقود في تعليمة print؛ لذلك يظهر خطأ في بناء الجملة (SyntaxError) قبل تشغيل البرنامج.",fixed:'student_name = "Sara"\nprint("Welcome", student_name)'},
{title:"النتيجة الغامضة",incident:"البرنامج يعمل، لكن متوسط الدرجات يظهر 125 بدلًا من 85. ما نوع الخطأ؟",code:'mark1 = 80\nmark2 = 90\naverage = mark1 + mark2 / 2\nprint(average)',type:1,explanation:"هذا خطأ منطقي؛ فالبرنامج ينفذ القسمة قبل الجمع. نحتاج إلى أقواس حول مجموع الدرجتين.",fixed:'mark1 = 80\nmark2 = 90\naverage = (mark1 + mark2) / 2\nprint(average)'},
{title:"التوقف المفاجئ",incident:"بدأ البرنامج التنفيذ، لكنه توقف عند حساب المتوسط وظهرت رسالة ZeroDivisionError.",code:'total = 100\nstudents = 0\naverage = total / students\nprint(average)',type:2,explanation:"هذا خطأ وقت تشغيل؛ لأن البرنامج يحاول القسمة على صفر أثناء التنفيذ.",fixed:'total = 100\nstudents = 0\nif students != 0:\n    average = total / students\n    print(average)\nelse:\n    print("لا يمكن القسمة على صفر")'}
];
const types=["خطأ لغوي (Syntax Error)","خطأ منطقي (Logical Error)","خطأ وقت التشغيل (Runtime Error)"];
let stage=-1,chosen=[null,null,null],notes=["","",""],name="",reflection="";
const app=document.getElementById("app"),progress=document.getElementById("progress");
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){progress.innerHTML=[0,1,2].map(i=>`<span class="${stage>=i?'on':''}"></span>`).join("");
if(stage===-1){app.innerHTML=`<div class="hero"><div><div class="mystery-art" role="img" aria-label="عدسة مكبرة متحركة تبحث عن الأدلة"><svg viewBox="0 0 240 220" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="glass"><stop stop-color="#b8fff2" stop-opacity=".43"/><stop offset="1" stop-color="#83a8ff" stop-opacity=".09"/></radialGradient><linearGradient id="handle" x2="1" y2="1"><stop stop-color="#e5baff"/><stop offset="1" stop-color="#7559c4"/></linearGradient></defs><circle class="lens-glow" cx="102" cy="89" r="77" fill="#9b89ff" opacity=".25"/><rect x="151" y="135" width="27" height="94" rx="13" fill="url(#handle)" stroke="#f7d5ff" stroke-width="4" transform="rotate(-43 164 160)"/><circle cx="102" cy="88" r="66" fill="#101b35" stroke="#d9c4ff" stroke-width="12"/><circle cx="102" cy="88" r="57" fill="url(#glass)" stroke="#7ee8d3" stroke-width="3"/><path d="M68 64q23-25 50-18" fill="none" stroke="white" stroke-opacity=".7" stroke-width="7" stroke-linecap="round"/><text x="100" y="105" font-size="50" text-anchor="middle" fill="#b7fbe9" font-family="monospace">?</text><g class="sparkle"><path d="M190 20v26m-13-13h26" stroke="#f6b6db" stroke-width="5" stroke-linecap="round"/></g><g class="sparkle two"><path d="M27 149v20m-10-10h20" stroke="#80e8d2" stroke-width="4" stroke-linecap="round"/></g></svg></div><div class="mystery-label">SEARCHING FOR CLUES...</div></div><div><span class="case-stamp">سري للغاية • CASE 001</span><h2>🚨 بلاغ عاجل من مختبر البرمجيات!</h2><p class="desc">ثلاث قضايا برمجية تنتظر تحقيقكِ. مهمتكِ هي فحص كل شيفرة، وتحديد نوع الخطأ، وتوثيق دليل يثبت اكتشافكِ. في النهاية ستحصلين على <b>تقرير المحققة</b> لإرساله إلى المعلمة.</p></div></div><div class="actions"><button onclick="start()">🚀 ابدئي المهمة السرية</button></div>`;return}
if(stage<3){let c=cases[stage],a=chosen[stage];app.innerHTML=`<div class="tag">📁 القضية ${stage+1} من 3</div><h2 style="margin-top:15px">${c.title}</h2><p class="desc">${c.incident}</p><label>💻 الشيفرة البرمجية تحت التحقيق</label><pre>${esc(c.code)}</pre><h3>🔍 ما نوع الخطأ؟</h3><div class="options">${types.map((t,i)=>`<button class="option ${a===i?(i===c.type?'good':'bad'):''}" ${a!==null?'disabled':''} onclick="choose(${i})">${t}</button>`).join("")}</div>${a!==null?`<div class="feedback"><b>${a===c.type?'🏆 اكتشاف صحيح!':'🔬 راجعي نتيجة التحقيق'}</b><div>${c.explanation}</div><b>🛠️ الشيفرة المصححة:</b><pre>${esc(c.fixed)}</pre></div><label for="note">📝 دليل التعلم: اكتبي لماذا حدث الخطأ وكيف عرفتِ نوعه</label><textarea id="note" placeholder="اكتبي ملاحظتكِ الخاصة...">${esc(notes[stage])}</textarea><div class="actions"><button onclick="next()">${stage===2?'📋 عرض التقرير النهائي':'القضية التالية ←'}</button></div>`:''}`;return}
const score=chosen.filter((a,i)=>a===cases[i].type).length;
app.innerHTML=`<div style="text-align:center;font-size:55px">🏆</div><h2 style="text-align:center">تقرير المحققة البرمجية</h2><div class="score">${score} / 3</div><p style="text-align:center" class="desc">إجابات صحيحة من المحاولة الأولى</p><div class="evidence"><b>👩🏻‍🎓 اسم المحققة:</b> ${esc(name)}</div><h3>📂 ملف الأدلة التي جمعتِها</h3>${cases.map((c,i)=>`<div class="evidence"><b>${i+1}. ${c.title}</b><br>التصنيف الصحيح: ${types[c.type]}<br>إجابتكِ: ${types[chosen[i]]}<br>دليلكِ: ${esc(notes[i])}</div>`).join("")}<label for="reflect">💡 سؤال التفكير الناقد: هل يمكن أن يعمل البرنامج دون رسائل خطأ، ومع ذلك تكون نتائجه غير صحيحة؟ أثبتي رأيكِ بدليل.</label><textarea id="reflect" oninput="reflection=this.value" placeholder="اكتبي استنتاجكِ ودليلكِ...">${esc(reflection)}</textarea><div class="actions"><button onclick="download()">📥 تنزيل تقرير الأدلة</button><button class="secondary" onclick="copyReport()">📋 نسخ التقرير</button><button class="secondary" onclick="certificate()">🏅 حفظ الشهادة PDF</button><button class="secondary" onclick="emailTeacher()">✉️ تجهيز رسالة للمعلمة</button><button class="secondary" onclick="newStudent()">👩🏻‍🎓 طالبة جديدة</button></div><p class="small" id="msg">لحفظ الشهادة: اضغطي «حفظ الشهادة PDF» ثم اختاري «حفظ كملف PDF» من نافذة الطباعة. بعدها اضغطي «تجهيز رسالة للمعلمة» وأرفقي ملف PDF يدويًا قبل الإرسال. لا يتم إرسال أي شيء تلقائيًا.</p>`}
function start(){name=document.getElementById("topStudent").value.trim();if(!name){alert("يرجى إدخال اسم الطالبة في أعلى الصفحة أولًا.");document.getElementById("topStudent").focus();return}stage=0;render()}function choose(i){if(chosen[stage]!==null)return;chosen[stage]=i;render()}
function next(){let v=document.getElementById("note").value.trim();if(!v){alert("اكتبي دليلًا من ملاحظاتكِ قبل الانتقال.");return}notes[stage]=v;stage++;render()}
function report(){name=document.getElementById("topStudent")?.value.trim()||name;reflection=document.getElementById("reflect")?.value.trim()||reflection;if(!name||!reflection){alert("يرجى كتابة اسم الطالبة وإجابة السؤال الختامي أولًا.");return null}let score=chosen.filter((a,i)=>a===cases[i].type).length;return `تقرير محققات الأخطاء البرمجية\nاسم الطالبة: ${name}\nالنتيجة: ${score}/3\n\n`+cases.map((c,i)=>`${c.title}\nإجابتي: ${types[chosen[i]]}\nالتصنيف الصحيح: ${types[c.type]}\nدليلي: ${notes[i]}`).join("\n\n")+`\n\nسؤال التفكير الناقد:\n${reflection}`}
function download(){let txt=report();if(!txt)return;let blob=new Blob(["\ufeff"+txt],{type:"text/plain;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="تقرير-محققة-الأخطاء.txt";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function copyReport(){let txt=report();if(!txt)return;try{await navigator.clipboard.writeText(txt);document.getElementById("msg").textContent="✅ تم نسخ التقرير بنجاح"}catch(e){document.getElementById("msg").textContent="تعذّر النسخ التلقائي؛ استخدمي زر تنزيل التقرير."}}
